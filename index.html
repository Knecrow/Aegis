<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AEGIS</title>
  
  <!-- Google Fonts: Orbitron & Roboto Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Roboto+Mono:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Lucide Icons CDN for HUD UI -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="theme-jarvis">

  <!-- HUD Background Canvas -->
  <canvas id="hud-canvas"></canvas>
  <div class="hud-overlay"></div>

  <!-- Main Container -->
  <div id="app-container" class="app-container">
    <!-- HUD Corner Bracket Decorations -->
    <div class="corner-tl"></div>
    <div class="corner-tr"></div>
    <div class="corner-bl"></div>
    <div class="corner-br"></div>

    <!-- HUD Header Panel -->
    <header id="hud-header" class="hud-header">
      <div class="brand-section">
        <div class="brand-title">
          <span class="brand-dot"></span>AEGIS
        </div>
        <div id="hud-clock" class="hud-clock">00:00:00</div>
      </div>

      <!-- Header Controls -->
      <div class="header-controls">
        <!-- Persona Toggle Switcher -->
        <div class="persona-toggle-container">
          <div id="persona-toggle" class="toggle-switch" title="Toggle Mode">
            <div class="toggle-thumb"></div>
          </div>
        </div>

        <button id="open-settings-btn" class="hud-btn" title="Settings" aria-label="Open Settings" style="padding: 8px 10px;">
          <i data-lucide="sliders-horizontal"></i>
        </button>
      </div>
    </header>

    <!-- Main Workspace (Sidebar + Chat) -->
    <div class="main-content">

      <!-- AI HUD Avatar Panel -->
      <aside class="avatar-sidebar">
        <div id="avatar-widget" class="avatar-widget">
          <!-- Animated HUD Tech Ring (Outer Gear Notches) -->
          <svg class="hex-ring" viewBox="0 0 200 200">
            <circle cx="100" cy="100" r="92" stroke="var(--color-primary)" stroke-width="2" fill="none" stroke-dasharray="14 8" />
            <polygon points="100 3, 184 51, 184 149, 100 197, 16 149, 16 51" stroke="var(--color-primary)" stroke-width="1.5" fill="none" opacity="0.6" />
          </svg>
          
          <!-- Counter-rotating Inner Compass Ring -->
          <svg class="hex-ring-inner" viewBox="0 0 200 200">
            <circle cx="100" cy="100" r="76" stroke="var(--color-secondary)" stroke-width="1.5" stroke-dasharray="6 4" fill="none" />
            <polygon points="100 20, 169 60, 169 140, 100 180, 31 140, 31 60" stroke="var(--color-secondary)" stroke-width="1" fill="none" opacity="0.8" />
          </svg>

          <!-- Core Avatar Orb (Arc Reactor / Ultron Matrix) -->
          <div class="avatar-core">
            <svg id="core-emblem-svg" class="core-emblem-svg" viewBox="0 0 100 100">
              <defs>
                <radialGradient id="jarvis-core-grad" cx="50%" cy="50%" r="50%">
                  <stop offset="0%" stop-color="#ffffff" />
                  <stop offset="40%" stop-color="#00ffff" />
                  <stop offset="80%" stop-color="#00d2ff" />
                  <stop offset="100%" stop-color="#0055ff" stop-opacity="0.2" />
                </radialGradient>
                <radialGradient id="ultron-core-grad" cx="50%" cy="50%" r="50%">
                  <stop offset="0%" stop-color="#ffffff" />
                  <stop offset="40%" stop-color="#ff003c" />
                  <stop offset="85%" stop-color="#800014" />
                  <stop offset="100%" stop-color="#1a0004" stop-opacity="0.3" />
                </radialGradient>
              </defs>

              <!-- 100% Abstract Technical JARVIS Arc Reactor Optics -->
              <g id="emblem-jarvis" style="opacity: 1; transition: opacity 1.8s ease-in-out;">
                <!-- Concentric Precision Ring Optics -->
                <circle cx="50" cy="50" r="42" fill="none" stroke="#00d2ff" stroke-width="1.5" stroke-dasharray="4 2" />
                <circle cx="50" cy="50" r="34" fill="none" stroke="#0055ff" stroke-width="2" />
                <circle cx="50" cy="50" r="24" fill="none" stroke="#00d2ff" stroke-width="1" stroke-dasharray="8 4" />
                
                <!-- Central Glowing Energy Core Singularity -->
                <circle cx="50" cy="50" r="14" fill="url(#jarvis-core-grad)" />
                <circle cx="50" cy="50" r="5" fill="#ffffff" />

                <!-- 6 Arc Reactor Energy Ray Beams -->
                <line x1="50" y1="8" x2="50" y2="26" stroke="#00d2ff" stroke-width="2" />
                <line x1="50" y1="92" x2="50" y2="74" stroke="#00d2ff" stroke-width="2" />
                <line x1="13.6" y1="29" x2="29.2" y2="38" stroke="#00d2ff" stroke-width="2" />
                <line x1="86.4" y1="71" x2="70.8" y2="62" stroke="#00d2ff" stroke-width="2" />
                <line x1="13.6" y1="71" x2="29.2" y2="62" stroke="#00d2ff" stroke-width="2" />
                <line x1="86.4" y1="29" x2="70.8" y2="38" stroke="#00d2ff" stroke-width="2" />

                <!-- Concentric Triangulated Energy Conduits -->
                <polygon points="50 18, 77 65, 23 65" fill="none" stroke="#00ffff" stroke-width="1.2" opacity="0.85" />
                <polygon points="50 82, 23 35, 77 35" fill="none" stroke="#0055ff" stroke-width="1.2" opacity="0.85" />
              </g>

              <!-- 100% Abstract Technical Ultron Consciousness Lattice Geometry -->
              <g id="emblem-ultron" style="opacity: 0; transition: opacity 1.8s ease-in-out;">
                <!-- Jagged Outer Matrix Polygon -->
                <polygon points="50 4, 90 27, 90 73, 50 96, 10 73, 10 27" fill="none" stroke="#ff003c" stroke-width="2" stroke-dasharray="10 4" />
                
                <!-- Intersecting Energy Rays & Diamond Core -->
                <polygon points="50 16, 80 50, 50 84, 20 50" fill="none" stroke="#ff003c" stroke-width="2.5" />
                <polygon points="50 26, 70 50, 50 74, 30 50" fill="url(#ultron-core-grad)" />

                <!-- Central Pulsing Crimson Singularity -->
                <circle cx="50" cy="50" r="9" fill="#ffffff" />
                <circle cx="50" cy="50" r="18" fill="none" stroke="#ff003c" stroke-width="1.5" stroke-dasharray="4 2" />

                <!-- Diagonal Energy Conduits -->
                <line x1="20" y1="20" x2="35" y2="35" stroke="#ff003c" stroke-width="2" />
                <line x1="80" y1="20" x2="65" y2="35" stroke="#ff003c" stroke-width="2" />
                <line x1="20" y1="80" x2="35" y2="65" stroke="#ff003c" stroke-width="2" />
                <line x1="80" y1="80" x2="65" y2="65" stroke="#ff003c" stroke-width="2" />
              </g>
            </svg>
          </div>
        </div>

        <!-- Avatar Sidebar Base -->
      </aside>

      <!-- Chat Feed Area -->
      <main class="chat-section">
        <div id="chat-messages" class="chat-messages">
          <!-- Initial AI Welcome Message -->
          <div class="message-row ai-msg">
            <div class="msg-avatar" id="welcome-msg-avatar">
              <svg class="chat-avatar-svg jarvis-avatar" viewBox="0 0 24 24" width="24" height="24">
                <circle cx="12" cy="12" r="7" fill="#00f0ff" opacity="0.25" />
                <circle cx="12" cy="12" r="7" fill="none" stroke="#00f0ff" stroke-width="2" />
                <circle cx="12" cy="12" r="3" fill="#ffffff" />
              </svg>
            </div>
            <div class="msg-bubble">
              <div class="msg-header">
                <span class="msg-sender" id="welcome-sender">JARVIS</span>
                <span>SYS // INIT</span>
              </div>
              <div class="msg-text" id="welcome-text">Greetings, Sir. How may I assist you today?</div>
            </div>
          </div>
        </div>

        <!-- Chat Input & Microphone Control Bar -->
        <div class="chat-input-area">
          
          <!-- Concentric Audio Rings & Mic Button -->
          <div class="mic-visualizer-wrapper">
            <div id="ring-1" class="mic-ring ring-1"></div>
            <div id="ring-2" class="mic-ring ring-2"></div>
            <div id="ring-3" class="mic-ring ring-3"></div>
            <button id="mic-btn" class="mic-btn" title="Toggle Voice Recognition" aria-label="Toggle Voice Recognition">
              <i data-lucide="mic"></i>
            </button>
          </div>

          <!-- Text Input -->
          <div class="input-wrapper">
            <input 
              type="text" 
              id="chat-input" 
              class="chat-input" 
              placeholder="Ask JARVIS..."
              autocomplete="off"
            />
          </div>

          <!-- Send Button -->
          <button id="send-btn" class="send-btn" title="Transmit" aria-label="Send Message">
            <i data-lucide="arrow-up-right"></i>
          </button>
        </div>
      </main>

    </div>
  </div>

  <!-- Overhauled High-Tech Settings Configuration Modal -->
  <div id="settings-modal" class="modal-backdrop">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">
          <i data-lucide="sliders-horizontal"></i> CONFIG <span class="config-sub-badge">SYSTEM NODE</span>
        </div>
        <button id="close-modal-btn" class="hud-btn" aria-label="Close Settings" style="padding: 4px 8px;">
          <i data-lucide="x"></i>
        </button>
      </div>

      <!-- Modal Body -->
      <div class="modal-body">

      <!-- API Key Field with Eye Visibility Toggle & Easy Get Key Link -->
      <div class="form-group">
        <label for="api-key-input" class="form-label">
          <span><i data-lucide="key-round" style="width: 13px; height: 13px; vertical-align: middle; margin-right: 4px;"></i> GEMINI API KEY</span>
          <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener" class="get-key-link" title="Get Free Gemini Key from Google AI Studio">
            <i data-lucide="external-link" style="width: 11px; height: 11px;"></i> GET FREE KEY
          </a>
        </label>
        <div class="input-key-wrapper">
          <input 
            type="password" 
            id="api-key-input" 
            class="form-input" 
            placeholder="Paste your Google AI Studio Key..."
          />
          <button id="toggle-key-vis" class="key-eye-btn" type="button" title="Toggle Visibility" aria-label="Toggle API Key Visibility">
            <i data-lucide="eye" id="eye-icon" style="width: 14px; height: 14px;"></i>
          </button>
        </div>
        <div class="key-status-hint">
          <span>Instant free tier key from Google AI Studio</span>
          <span id="key-status-badge" style="color: var(--color-primary); font-weight: 600;">REQUIRED</span>
        </div>
      </div>

      <!-- Voice Output Toggle Row -->
      <div class="config-row-toggle">
        <div class="config-toggle-info">
          <div class="config-toggle-title">
            <i data-lucide="volume-2" style="width: 14px; height: 14px; color: var(--color-primary);"></i> Voice Synthesis
          </div>
          <div class="config-toggle-desc">Auto-read AI responses with persona voices</div>
        </div>
        <input type="checkbox" id="tts-toggle" style="transform: scale(1.2); cursor: pointer;" checked />
      </div>

      <!-- Voice Pitch Telemetry Slider -->
      <div class="slider-container">
        <div class="slider-header">
          <span><i data-lucide="activity" style="width: 13px; height: 13px; vertical-align: middle; margin-right: 4px;"></i> Voice Modulation Pitch</span>
          <span id="pitch-val-readout">1.0x</span>
        </div>
        <input type="range" id="tts-pitch-slider" class="hud-range-slider" min="0.5" max="1.5" step="0.05" value="1.0" />
      </div>

      <!-- Swarm Orbit Speed Slider -->
      <div class="slider-container">
        <div class="slider-header">
          <span><i data-lucide="cpu" style="width: 13px; height: 13px; vertical-align: middle; margin-right: 4px;"></i> Nanotech Swarm Speed</span>
          <span id="swarm-val-readout">1.0x</span>
        </div>
        <input type="range" id="swarm-speed-slider" class="hud-range-slider" min="0.3" max="2.5" step="0.1" value="1.0" />
      </div>

      </div><!-- /.modal-body -->

      <div class="modal-footer">
        <button id="clear-chat-btn" class="config-clear-btn" type="button" aria-label="Purge chat logs">
          <i data-lucide="trash-2" style="width: 14px; height: 14px;"></i> PURGE LOGS
        </button>
        <button id="save-settings-btn" class="config-save-btn" type="button" aria-label="Save configuration">
          <i data-lucide="save" style="width: 14px; height: 14px;"></i> SAVE CONFIG
        </button>
      </div>
    </div>
  </div>

  <!-- Audio Chimes via Web Audio Synth -->
  <script type="module" src="./js/audio.js"></script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
